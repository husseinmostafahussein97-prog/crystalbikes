<style>
:root{--bg:#f4f6f1;--fg:#1c261c;--card:#fff;--mut:#6a7468;--bd:#d8ddd2;--pri:#2e7d32;--pf:#fff;--bad:#c0392b;--wrn:#d98400;--ok:#2e7d32;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101510;--fg:#e8efe6;--card:#1a211a;--mut:#98a395;--bd:#2c372b;--pri:#66bb6a;--pf:#0c140c;--bad:#ef7b6f;--wrn:#f0b04a;--ok:#66bb6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101510;--fg:#e8efe6;--card:#1a211a;--mut:#98a395;--bd:#2c372b;--pri:#66bb6a;--pf:#0c140c;--bad:#ef7b6f;--wrn:#f0b04a;--ok:#66bb6a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--pri);color:var(--pf)}
header b{font-size:17px}
.chip{border:1px solid currentColor;border-radius:99px;padding:1px 9px;font-size:12px;margin-inline-start:6px}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
nav button{flex:none}
main{padding:0 12px 24px;max-width:900px;margin:0 auto}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;cursor:pointer}
button.on{background:var(--pri);color:var(--pf);border-color:var(--pri)}
button:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%}
input.sm{width:64px;padding:6px}
input.md{width:104px;padding:6px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.st{display:flex;align-items:center;gap:14px}.st button{width:48px;font-size:20px}.st b{font-size:22px;min-width:30px;text-align:center}
#tot{font-size:22px;margin:16px 0 4px}
.m{color:var(--mut);font-size:13px;font-weight:400}
#sv{width:100%;padding:14px;font-size:17px;background:var(--pri);color:var(--pf);border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.k b{display:block;font-size:19px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}th{color:var(--mut);font-weight:600}
.b{border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;border:1px solid currentColor}.b.ok{color:var(--ok)}.b.wrn{color:var(--wrn)}.b.bad{color:var(--bad)}
h3{margin:18px 0 4px}
#lo{padding:3px 10px;margin-inline-start:8px;font-size:13px}
.cols{display:flex;gap:2px;height:150px;margin-bottom:18px}.cols>div{flex:1;position:relative;display:flex;align-items:flex-end}.cols i{display:block;width:100%;background:var(--pri);border-radius:3px 3px 0 0}.cols span{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:9px;color:var(--mut)}
.hb{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;margin:6px 0}.hb i{display:block;height:14px;background:var(--pri);border-radius:4px}.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;display:none;z-index:9}
/* ===== Design 1: Red Sea ===== */
:root[data-skin="sea"]{--bg:#e9f1f3;--fg:#0d2b36;--card:#fff;--mut:#5b7480;--bd:#cfdfe5;--pri:#0a6c88;--pf:#fff;--ok:#1c8a5a;--wrn:#b97700;--bad:#c2413a;color-scheme:light}
@media(prefers-color-scheme:dark){:root[data-skin="sea"]:not([data-theme="light"]){--bg:#0a1b21;--fg:#e3f0f4;--card:#11262e;--mut:#8ea9b3;--bd:#21404b;--pri:#4fb3cf;--pf:#04161c;--ok:#5fcf98;--wrn:#f2b84b;--bad:#f07f76;color-scheme:dark}}
:root[data-skin="sea"] body{font-family:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif}
:root[data-skin="sea"] header{border-bottom:4px solid #f2b705}
:root[data-skin="sea"] nav button{border-radius:99px;padding:8px 16px}
:root[data-skin="sea"] .card{border-radius:18px}
:root[data-skin="sea"] .k{border-radius:14px;border-inline-start:5px solid var(--pri)}
:root[data-skin="sea"] .k b{font-size:21px;color:var(--pri)}
:root[data-skin="sea"] button,:root[data-skin="sea"] select,:root[data-skin="sea"] input,:root[data-skin="sea"] textarea{border-radius:12px}
:root[data-skin="sea"] #sv{border-radius:14px;font-weight:600}
:root[data-skin="sea"] h3{color:var(--pri);font-weight:600}

</style></head><body>

 <h3>Exchange rates (EGP per 1)</h3>${rateCard()}<div class="card row"><div>USD ${inp("rates|USD",cfg.rates.USD)}</div><div>EUR ${inp("rates|EUR",cfg.rates.EUR)}</div><div>Low stock at ${inp("low",cfg.low==null?1:cfg.low)}</div><div>Visa fee % ${inp("visaFee",vfee())}</div></div>
 <h3>Rent prices (EGP)</h3><div class="card tw"><table><tr><th>Vehicle</th>${D.map(d=>`<th>${d}</th>`).join("")}</tr>${Object.keys(cfg.rent||{}).map(v=>`<tr><td>${esc(v)}</td>${D.map(d=>`<td>${inp("rent|"+v+"|"+d,(cfg.rent[v]||{})[d])}</td>`).join("")}</tr>`).join("")}</table></div>`;
 return h;
}
function setCfg(p,v){
 const k=p.split("|");if(v===""&&(k[0]==="rates"||k[0]==="low"||k[0]==="visaFee"||k[0]==="rateMargin"))return;
 const c=JSON.parse(JSON.stringify(cfg));let o=c;for(let i=0;i<k.length-1;i++)o=o[k[i]]=o[k[i]]||{};
 if(v===""||isNaN(+v))delete o[k[k.length-1]];else o[k[k.length-1]]=+v;
 db.doc("config/main").set(c).then(()=>toast("Saved ✓")).catch(e=>{er(e);render()});
}

/* ---------- Events ---------- */
setInterval(()=>{if(!cfg)return;if(stale&&!typing())render();else if(tab==="out")render();else if(tab==="new"&&built)bannerUpd(navUpd())},60000);
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==="out"){sb.auth.signOut().then(()=>location.reload())}
 else if(a==="lang")setLang(lang==="ar"?"en":"ar")
 else if(a==="tab"){if(F.editId&&v!=="new")F={type:"rent",qty:1,pay:"Cash EGP"};tab=v;armed="";render()}
 else if(a==="type"){F={type:v,qty:1,pay:F.pay,veh:F.veh,svc:F.svc,pid:F.pid,date:F.date,editId:F.editId,ok:F.ok,ou:F.ou,oq:F.oq,oi:F.oi,opid:F.opid,cust:F.cust,phone:F.phone,note:F.note,owe:F.owe};render()}
 else if(a==="uselist"){F.ou=+v;const e=$("#ouin");if(e)e.value=F.ou;upd()}
 else if(a==="fcancel"){F={type:"rent",qty:1,pay:"Cash EGP"};tab="tx";render()}
 else if(a==="rng"){const d=new Date(),m=String(d.getMonth()+1).padStart(2,"0");flt.from=v==="month"?d.getFullYear()+"-"+m+"-01":today();flt.to=today();render()}
 else if(a==="pay"){F.pay=v;F.paidT=false;F.paid="";render()}
 else if(a==="q"){F.qty=Math.max(1,F.qty+ +v);upd()}
 else if(a==="vc"){F.vc=Math.max(1,(+F.vc||1)+ +v);upd()}
 else if(a==="save")save();
 else if(a==="exp")exp();
 else if(a==="addp")addProd();
 else if(a==="adds"){const n=$("#ns-n").value.trim(),pv=$("#ns-p").value.trim(),p=+pv;if(!n||pv===""||!(p>=0))return toast("Enter name and price");const c=JSON.parse(JSON.stringify(cfg));c.services=c.services||{};c.services[n]=p;db.doc("config/main").set(c).then(()=>toast("Added ✓")).catch(er)}
 else if(a==="rs"){const q=+$("#rs"+v).value;if(q>0)db.collection("tx").add({ts:Date.now(),date:today(),by:me.id,type:"restock",pid:v,qty:q}).then(()=>toast("Stock added ✓")).catch(er)}
 else if(a==="edit"&&(()=>{const t=txs.find(x=>x.id===v);if(!t||t.type==="pay")return false;
  const f={type:t.type,editId:t.id,date:t.date,qty:t.qty||1,pay:t.pay,paid:+(+nat(t)).toFixed(2),paidT:true,cust:t.customer||"",phone:t.phone||"",note:t.note||"",owe:!!t.owe,disc:t.discAmt!=null?t.discAmt:(t.disc||0),dcur:t.discCur||"EGP"};if(t.changeEGP!=null){Object.assign(f,{chg:true,given:t.given,chgE:t.changeEGP,chgT:true})}
  if(t.type==="rent")Object.assign(f,{veh:t.item,dur:t.dur,vc:t.cnt||1,ok:"r|"+t.item+"|"+t.dur,ou:t.unit});
  else if(t.type==="sale")Object.assign(f,{pid:t.pid,opid:t.pid,ok:"s|"+t.pid,ou:t.unit,oq:t.qty,oi:t.item});
  else Object.assign(f,{type:"maint",qty:1,det:t.det||"",work:t.item,amt:t.free?t.unit:t.unit*(t.qty||1)+(+t.extra||0)});
  F=f;tab="new";render();window.scrollTo(0,0);return true})()){}
 else if(a==="edit"){const t=txs.find(x=>x.id===v);if(t){ed=v;E={cnt:t.cnt||1,work:t.item,amt:t.unit,date:t.date,qty:t.qty,disc:t.discAmt!=null?t.discAmt:(t.disc||0),dcur:t.discCur||"EGP",extra:t.extra||0,pay:t.pay,paid:+(+(t.paid!=null?t.paid:t.collect)).toFixed(2),cust:t.customer||"",note:t.note||""};render();window.scrollTo(0,0)}}
 else if(a==="ret"){if(armed===v){armed="";db.collection("ret").add({tid:v,ts:Date.now(),date:today(),by:me.id}).then(()=>toast("Returned ✓")).catch(er)}else{armed=v;render()}}
 else if(a==="ccsave")ccsave("close");
 else if(a==="ccopen")ccsave("open");
 else if(a==="scsave")scsave();
 else if(a==="scrv"){rv=v;render();window.scrollTo(0,0)}
 else if(a==="scclose"){rv=null;render()}
 else if(a==="scapply")scMark("applied");
 else if(a==="scign")scMark("ignored");
 else if(a==="cchk")ccCheck(v);
 else if(a==="ccedit"){const x=ccs.find(y=>y.id===v);if(x){cce=v;CE={note:x.note||""};CUR.forEach(c=>CE[c]=(x.cnt||{})[c]!=null?x.cnt[c]:"");render();window.scrollTo(0,0)}}
 else if(a==="cecancel"){cce=null;CE={};render()}
 else if(a==="cesave")ccEditSave();
 else if(a==="mvsave")mvsave();
 else if(a==="dlday")dlDay();
 else if(a==="dlcash")cashReport();
 else if(a==="rtupd"||a==="rtkeep"){if(LR.st==="ok"){const c=JSON.parse(JSON.stringify(cfg));c.rateSeen={USD:sugg("USD"),EUR:sugg("EUR")};if(a==="rtupd"){c.rates.USD=sugg("USD");c.rates.EUR=sugg("EUR")}db.doc("config/main").set(c).then(()=>toast(a==="rtupd"?"Rates updated ✓":"Saved ✓")).catch(er)}}
 else if(a==="userate"){if(LR[v])setCfg("rates|"+v,String(sugg(v)))}
 else if(a==="oppay"){const t=txs.find(x=>x.id===v);if(t){OP={id:v,pay:"Cash EGP",amt:Math.round(remainOf(t))};render();window.scrollTo(0,0)}}
 else if(a==="opcancel"){OP={};render()}
 else if(a==="opsave")opsave();
 else if(a==="ptsave")ptsave();
 else if(a==="ptedit"){const x=pts.find(y=>y.id===v);if(x){PT={month:x.id,egp:x.egp,visa:x.visa,insta:x.insta,usd:x.usd,eur:x.eur,exp:x.exp,cEGP:x.hasClose?x.cEGP:"",cUSD:x.hasClose?x.cUSD:"",cEUR:x.hasClose?x.cEUR:"",note:x.note||""};render();const e=document.querySelector('[data-pt="month"]');if(e)e.scrollIntoView({block:"center"})}}
 else if(a==="ptdel"){if(armed==="pt"+v){armed="";db.doc("pt/"+v).delete().catch(er)}else{armed="pt"+v;render()}}
 else if(a==="mvdel"){if(armed===v){armed="";db.doc("cm/"+v).delete().catch(er)}else{armed=v;render()}}
 else if(a==="vfix"){if(armed==="vfix"){armed="";vfix()}else{armed="vfix";render()}}
 else if(a==="ccdel"){if(armed===v){armed="";ccDel(v)}else{armed=v;render()}}
 else if(a==="scdel"){if(armed===v){armed="";if(rv===v)rv=null;db.doc("sc/"+v).delete().then(()=>toast("Undone ✓")).catch(er)}else{armed=v;render()}}
 else if(a==="xsave")xsave();
 else if(a==="fxsave")fxsave();
 else if(a==="fxdel"){if(armed===v){armed="";db.doc("fx/"+v).delete().catch(er)}else{armed=v;render()}}
 else if(a==="cr"){const d=new Date(),m=String(d.getMonth()+1).padStart(2,"0");if(v==="today"){cr.from=cr.to=today()}else if(v==="month"){cr.from=d.getFullYear()+"-"+m+"-01";cr.to=today()}else{cr.from="2000-01-01";cr.to=today()}render()}
 else if(a==="xexp")xexp();
 else if(a==="xdel"){if(armed===v){armed="";db.doc("exp/"+v).delete().catch(er)}else{armed=v;render()}}
 else if(a==="ecancel"){ed=null;render()}
 else if(a==="esave")eSave();
 else if(a==="rexp"){const keep=Object.assign({},flt);Object.assign(flt,{from:rf+"-01",to:rt+"-31",type:"",by:""});exp().finally(()=>Object.assign(flt,keep))}
 else if(a==="rr"){const d=new Date(),k=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");rt=k(d);rf=v==="1"?rt:v==="3"?k(new Date(d.getFullYear(),d.getMonth()-2,1)):d.getFullYear()+"-01";render()}
 else if(a==="del"){if(armed===v){armed="";db.doc("tx/"+v).delete().then(()=>Promise.all(fxs.filter(x=>x.ref===v).map(x=>db.doc("fx/"+x.id).delete()))).catch(er)}else{armed=v;render()}}
});
document.addEventListener("input",e=>{const t=e.target,f=t.dataset.f;if(t.dataset.sc!==undefined){SC[t.dataset.sc]=t.value;return}if(t.dataset.ce!==undefined){CE[t.dataset.ce]=t.value;return}if(t.dataset.m!==undefined){M[t.dataset.m]=t.value;return}if(t.dataset.pt!==undefined){PT[t.dataset.pt]=t.value;return}if(t.dataset.op!==undefined){OP[t.dataset.op]=t.value;if(t.dataset.op==="pay"){const x=txs.find(y=>y.id===OP.id),c=pcur(t.value),r=remainOf(x);OP.amt=c==="EGP"?Math.round(r):(r/rate(c)).toFixed(2);render()}return}if(t.dataset.x!==undefined){X[t.dataset.x]=t.value;return}if(t.dataset.fx!==undefined){FX[t.dataset.fx]=t.value;return}if(t.dataset.cc!==undefined){const k=t.dataset.cc.split("|");if(k[0]==="o")CC.open[k[1]]=t.value;else if(k[0]==="n")CC.cnt[k[1]]=t.value;else CC.note=t.value;updCC();return}if(t.dataset.e){E[t.dataset.e]=t.value;if(t.dataset.e==="pay"){E.paid="";render()}return}if(!f)return;
 F[f]=(f==="disc"||f==="extra")?(+t.value||0):f==="owe"||f==="chg"?t.checked:t.value;if(f==="chgE")F.chgT=t.value!=="";if(f==="paid")F.paidT=t.value!=="";
 if(f==="veh")$("#dur").innerHTML=durOpts();
 if(f==="veh")F.dur=$("#dur").value;
 upd();
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.od!==undefined){onlyDiff=t.checked;render();return}
 if(t.dataset.dr!==undefined){drd=t.value||today();return}
 if(t.dataset.sp!==undefined){const c=JSON.parse(JSON.stringify(cfg));c.staffProducts=t.checked;db.doc("config/main").set(c).then(()=>toast("Saved ✓")).catch(x=>{er(x);render()});return}
 if(t.dataset.l){flt[t.dataset.l]=t.value;render()}
 else if(t.dataset.r){if(t.dataset.r==="c")rc=t.value;else if(t.dataset.r==="f"){rf=t.value||rf;if(rt<rf)rt=rf}else if(t.dataset.r==="t"){rt=t.value||rt;if(rt<rf)rf=rt}render()}
 else if(t.dataset.c2){cr[t.dataset.c2]=t.value;render()}
 else if(t.dataset.c)setCfg(t.dataset.c,t.value);
 else if(t.dataset.p)editProd(t);
});
