async function bootSB(){

 sb=supabase.createClient(SB_URL,SB_KEY);
 let{data:{session}}=await sb.auth.getSession();
 while(!session)session=await loginUI();
 const uid=session.user.id,{data:pf,error}=await sb.from("profiles").select("name,role").eq("id",uid).single();
 if(error)throw new Error("Your profile was not found. Ask the admin.");
 const USR={me:async()=>({id:uid,name:pf.name}),canEdit:async()=>pf.role==="admin",
  profiles:async ids=>{const{data}=await sb.from("profiles").select("id,name").in("id",ids);const o={};(data||[]).forEach(x=>o[x.id]={name:x.name});return o}};
 const DL={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
 return[DB,USR,DL]}

  me=await usr.me();admin=await usr.canEdit();

  db.collection("fx").onSnapshot(s=>{fxs=byTs(wid(s));loadNames();refresh()},er);
  db.collection("exp").onSnapshot(s=>{exps=byTs(wid(s));loadNames();refresh()},er);

/* ---------- New transaction ---------- */
function calc(){
 let unit,item="",extra=+F.extra||0;const disc=(+F.disc||0)*rate(F.dcur||"EGP");
 if(F.type==="rent"){item=F.veh;unit=(cfg.rent[F.veh]||{})[F.dur];extra=0}
 else if(F.type==="sale"){const p=prods.find(x=>x.id===F.pid);item=p?p.name:"";unit=p?pEGP(p):undefined;extra=0}
 else{item=F.svc;unit=(cfg.services||{})[F.svc]}
 const ok=typeof unit==="number"&&!!item&&F.qty>0;
 return{item,unit,disc,extra,ok,total:ok?unit*F.qty+extra-disc:null}
}
function upd(){upd0();tr($("#v"))}
function upd0(){
 const c=calc(),el=$("#tot");if(!el)return;
 const dn=$("#dn");if(dn)dn.textContent=F.date&&F.date!==today()?"⚠ Recording for a past date: "+F.date:"";
 if(!c.ok){el.innerHTML='<span class="m">Choose all options</span>';$("#sv").disabled=true;return}
 const cur=pcur(F.pay),ex=cur==="EGP"?c.total:c.total/rate(cur),pi=$("#paid");
 el.innerHTML=`<span class="m">Total after discount</span><br><b>${n0(c.total)} EGP</b> `+(cur!=="EGP"?`<span class="m">= ${ex.toFixed(2)} ${cur}</span>`:"");
 $("#plab").textContent="Amount you actually collected ("+cur+")";
 if(!F.paidT)pi.value=cur==="EGP"?Math.round(ex):ex.toFixed(2);
 const df=(F.paidT?+pi.value:ex)-ex;
 $("#pd").textContent=Math.abs(df)>0.005?"Difference from total: "+(df>0?"+":"")+df.toFixed(cur==="EGP"?0:2)+" "+cur:"";
 $("#sv").disabled=c.total<0;$("#q").textContent=F.qty;
}

function durOpts(){const d=D.filter(x=>typeof(cfg.rent[F.veh]||{})[x]==="number");if(!d.includes(F.dur))F.dur=d[0];return opts(d.map(x=>[x,x+" – "+n0(cfg.rent[F.veh][x])+" EGP"]),F.dur)}
function viewNew(){

 if(!vehs.includes(F.veh))F.veh=vehs[0];if(!svcs.includes(F.svc))F.svc=svcs[0];
 const ps=[...prods].sort((a,b)=>(a.cat+a.name).localeCompare(b.cat+b.name));
 if(!ps.some(p=>p.id===F.pid&&stock(p.id)>0)){const f=ps.find(p=>stock(p.id)>0);F.pid=f?f.id:""}

 if(F.type==="maint")h+=`<label>Bike / vehicle details</label><input data-f="det" value="${esc(F.det||"")}" placeholder="e.g. red scooter"><label>Service</label><select data-f="svc">${opts(svcs.map(s=>[s,s+" – "+n0(cfg.services[s])+" EGP"]),F.svc)}</select><label>Quantity</label>`;
 h+=`<div class="st"><button data-a="q" data-v="-1">−</button><b id="q">${F.qty}</b><button data-a="q" data-v="1">+</button></div>`;

 h+=`<label>Discount given (optional)</label><div class="row"><input data-f="disc" type="number" inputmode="decimal" min="0" value="${F.disc||""}"><select data-f="dcur">${opts(["EGP","USD","EUR"].map(x=>[x,x]),F.dcur||"EGP")}</select></div>`;

 <label>Note (optional)</label><input data-f="note" value="${esc(F.note||"")}"><div id="tot"></div><button id="sv" data-a="save">Save transaction</button></div>`;
 return h;

async function save(){

 const cur=pcur(F.pay),ex=cur==="EGP"?c.total:c.total/rate(cur);
 let paid=F.paidT?+F.paid:ex;if(isNaN(paid)||paid<0)return toast("Check the collected amount");paid=Math.round(paid*100)/100;
 const dt=admin&&F.date?F.date:today(),ts=dt===today()?Date.now():new Date(dt+"T"+new Date().toTimeString().slice(0,8)).getTime();
 const d={ts:ts,date:dt,by:me.id,type:F.type,item:c.item,qty:F.qty,unit:c.unit,disc:c.disc,discAmt:+F.disc||0,discCur:F.dcur||"EGP",extra:c.extra,total:c.total,pay:F.pay,cur:cur,collect:ex,paid:paid,paidE:paid*rate(cur),customer:F.cust||"",note:F.note||""};
 if(F.type==="rent"){d.dur=F.dur;if(dt===today())d.live=true}if(F.type==="sale"){d.pid=F.pid;const pp=prods.find(x=>x.id===F.pid);if(pp&&pp.cost!=null){d.costN=pp.cost;d.costC=pp.cur||"EGP"}}if(F.type==="maint")d.det=F.det||"";
 $("#sv").disabled=true;
 try{await db.collection("tx").add(d);F={type:F.type,qty:1,pay:F.pay,veh:F.veh,svc:F.svc,date:F.date};toast("Saved ✓"+(dt!==today()?" ("+dt+")":""));render()}catch(e){er(e);$("#sv").disabled=false}
}

const CUR=["EGP","USD","EUR"],nat=t=>t.paid!=null?t.paid:t.collect,fmc2=(c,v)=>c==="EGP"?n0(v):(+v).toFixed(2),dis=t=>t.discAmt!=null?t.discAmt:(t.disc||0),dcu=t=>t.discCur||"EGP";
function mstr(L,af,cf){const o={};L.forEach(x=>{const c=cf(x);o[c]=(o[c]||0)+(+af(x)||0)});const a=CUR.filter(c=>Math.abs(o[c]||0)>0.004).map(c=>fmc2(c,o[c])+" "+c);return a.length?a.join(" + "):"0"}
const mcol=L=>mstr(L,nat,t=>t.cur);
function breakdowns(R){

 const one=(type,title,label,cl,kf,cf)=>{const o={};R.filter(t=>t.type===type).forEach(t=>{const k=kf(t),x=o[k]=o[k]||{n:0,L:[]};x.n+=cf(t);x.L.push(t)});
  const rows=Object.entries(o).sort((a,b)=>b[1].n-a[1].n);
  return rows.length?`<h3>${title}</h3><div class="card tw"><table><tr><th>${label}</th><th>${cl}</th><th>Collected</th></tr>${rows.map(x=>`<tr><td>${esc(x[0])}</td><td><b>${x[1].n}</b></td><td>${mcol(x[1].L)}</td></tr>`).join("")}</table></div>`:""};
 return one("rent","Rentals by vehicle","Vehicle","Rentals",t=>t.item,t=>1)+one("sale","Sales by category","Category","Units sold",cat,t=>t.qty)+one("maint","Maintenance by service","Service","Jobs",t=>t.item,t=>1)}
function typeTable(R,noh){

function profitSec(R,X2){
 const uc=t=>{if(t.costN!=null)return{n:t.costN,c:t.costC||"EGP"};if(t.costE!=null)return{n:t.costE,c:"EGP"};const p=prods.find(x=>x.id===t.pid);return p&&p.cost!=null?{n:p.cost,c:p.cur||"EGP"}:null};
 const rev={},cst={},exc={},by={};let miss=0;CUR.forEach(c=>{rev[c]=0;cst[c]=0;exc[c]=0});
 R.forEach(t=>{rev[t.cur]=(rev[t.cur]||0)+nat(t)});X2.forEach(x=>{exc[x.cur]=(exc[x.cur]||0)+(+x.amt)});
 R.filter(t=>t.type==="sale").forEach(t=>{const u=uc(t),o=by[t.item]=by[t.item]||{q:0,rv:{},cs:{},m:0};o.q+=t.qty;o.rv[t.cur]=(o.rv[t.cur]||0)+nat(t);
  if(u){cst[u.c]=(cst[u.c]||0)+u.n*t.qty;o.cs[u.c]=(o.cs[u.c]||0)+u.n*t.qty}else{miss++;o.m=1}});
 const os=o=>{const a=CUR.filter(c=>Math.abs(o[c]||0)>0.004).map(c=>fmc2(c,o[c])+" "+c);return a.length?a.join(" + "):"0"};
 const row=(l,f,b)=>`<tr><td>${b?"<b>"+l+"</b>":l}</td>${CUR.map(c=>`<td>${b?"<b>"+fmc2(c,f(c))+"</b>":fmc2(c,f(c))}</td>`).join("")}</tr>`;
 const prof=x=>{if(x.m)return["no cost",""];const a=Object.keys(x.rv),b=Object.keys(x.cs);if(a.length!==1||b.length>1||(b.length&&b[0]!==a[0]))return["–",""];const c=a[0],r=x.rv[c],k=x.cs[c]||0;return[fmc2(c,r-k)+" "+c,r?Math.round((r-k)/r*100)+"%":""]};
 return`<h3>Profit</h3><div class="card tw"><table><tr><th></th>${CUR.map(c=>`<th>${c}</th>`).join("")}</tr>${row("Revenue (collected)",c=>rev[c])}${row("− Cost of items sold",c=>cst[c])}${row("− Expenses",c=>exc[c])}${row("= Net profit",c=>rev[c]-cst[c]-exc[c],1)}</table>
 <p class="m">Profit is calculated in each currency separately. Cost counts in the currency it was bought in.</p></div>
 ${miss?`<p class="m">${miss} sold item(s) have no cost price, so profit is overstated.</p>`:""}
 <h3>Profit by product</h3><div class="card tw"><table><tr><th>Product</th><th>Sold</th><th>Revenue</th><th>Cost</th><th>Profit</th><th>Margin</th></tr>${Object.entries(by).map(e=>{const x=e[1],p=prof(x);return`<tr><td>${esc(e[0])}</td><td>${x.q}</td><td>${os(x.rv)}</td><td>${os(x.cs)}</td><td><b>${p[0]}</b></td><td>${p[1]}</td></tr>`}).join("")||'<tr><td class="m">No data</td></tr>'}</table></div>`}

  const d=Object.assign({},p);delete d.id;d.opening=(+p.opening||0)+(n-cur);
  try{await db.doc("products/"+a[0]).set(d);toast("Stock set to "+n+" ✓")}catch(e){er(e);t.value=cur}return}
 if(a[1]==="cost"){const d=Object.assign({},p);delete d.id;if(v==="")delete d.cost;else{if(isNaN(+v)||+v<0){toast("Enter 0 or more");t.value=p.cost==null?"":p.cost;return}d.cost=+v}
  try{await db.doc("products/"+a[0]).set(d);toast("Saved ✓")}catch(e){er(e)}return}
 if(a[1]==="price")v=+v;
 if(!v||(a[1]==="price"&&!(v>0))){toast("Cannot be empty");t.value=p[a[1]];return}
 const d=Object.assign({},p);delete d.id;d[a[1]]=v;
 try{await db.doc("products/"+a[0]).set(d);toast("Saved ✓")}catch(e){er(e);t.value=p[a[1]]}
}
async function addProd(){
 const g=i=>$("#"+i).value.trim(),n=g("np-n"),p=+g("np-p");if(!n||!(p>0))return toast("Enter name and price");
 try{await db.collection("products").add(Object.assign({cat:g("np-c")||"Other",name:n,opening:+g("np-q")||0,price:p,cur:$("#np-u").value},g("np-k")!==""?{cost:+g("np-k")}:{}));toast("Added ✓")}catch(e){er(e)}
}

/* ---------- Settings (admin) ---------- */
function viewSet(){
 const inp=(p,v)=>`<input class="sm" type="number" inputmode="decimal" data-c="${esc(p)}" value="${v==null?"":v}">`;
 let h=`<h3>Exchange rates (EGP per 1)</h3><div class="card row"><div>USD ${inp("rates|USD",cfg.rates.USD)}</div><div>EUR ${inp("rates|EUR",cfg.rates.EUR)}</div><div>Low stock at ${inp("low",cfg.low==null?1:cfg.low)}</div></div>
 <h3>Rent prices (EGP)</h3><div class="card tw"><table><tr><th>Vehicle</th>${D.map(d=>`<th>${d}</th>`).join("")}</tr>${Object.keys(cfg.rent||{}).map(v=>`<tr><td>${esc(v)}</td>${D.map(d=>`<td>${inp("rent|"+v+"|"+d,(cfg.rent[v]||{})[d])}</td>`).join("")}</tr>`).join("")}</table></div>
 <h3>Maintenance services (EGP)</h3><div class="card tw"><table>${Object.keys(cfg.services||{}).map(s=>`<tr><td>${esc(s)}</td><td>${inp("services|"+s,cfg.services[s])}</td></tr>`).join("")}</table>
 <div class="row" style="margin-top:8px"><input id="ns-n" placeholder="New service name"><input id="ns-p" type="number" inputmode="numeric" placeholder="Price"><button data-a="adds" style="flex:none">Add</button></div></div>`;
 return h;
}
function setCfg(p,v){
 const k=p.split("|");if(v===""&&(k[0]==="rates"||k[0]==="low"))return;
 const c=JSON.parse(JSON.stringify(cfg));let o=c;for(let i=0;i<k.length-1;i++)o=o[k[i]]=o[k[i]]||{};
 if(v===""||isNaN(+v))delete o[k[k.length-1]];else o[k[k.length-1]]=+v;
 db.doc("config/main").set(c).then(()=>toast("Saved ✓")).catch(e=>{er(e);render()});
}

/* ---------- Events ---------- */
setInterval(()=>{if(!cfg)return;if(stale&&!typing())render();else if(tab==="out")render();else if(tab==="new"&&built)bannerUpd(navUpd())},60000);
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==="out"){sb.auth.signOut().then(()=>location.reload())}
 else if(a==="lang")setLang(lang==="ar"?"en":"ar")
 else if(a==="tab"){tab=v;armed="";render()}
 else if(a==="type"){F={type:v,qty:1,pay:F.pay,veh:F.veh,svc:F.svc,pid:F.pid,date:F.date};render()}
 else if(a==="rng"){const d=new Date(),m=String(d.getMonth()+1).padStart(2,"0");flt.from=v==="month"?d.getFullYear()+"-"+m+"-01":today();flt.to=today();render()}
 else if(a==="pay"){F.pay=v;F.paidT=false;F.paid="";render()}
 else if(a==="q"){F.qty=Math.max(1,F.qty+ +v);upd()}
 else if(a==="save")save();
 else if(a==="exp")exp();
 else if(a==="addp")addProd();
 else if(a==="adds"){const n=$("#ns-n").value.trim(),pv=$("#ns-p").value.trim(),p=+pv;if(!n||pv===""||!(p>=0))return toast("Enter name and price");const c=JSON.parse(JSON.stringify(cfg));c.services=c.services||{};c.services[n]=p;db.doc("config/main").set(c).then(()=>toast("Added ✓")).catch(er)}
 else if(a==="rs"){const q=+$("#rs"+v).value;if(q>0)db.collection("tx").add({ts:Date.now(),date:today(),by:me.id,type:"restock",pid:v,qty:q}).then(()=>toast("Stock added ✓")).catch(er)}
 else if(a==="edit"){const t=txs.find(x=>x.id===v);if(t){ed=v;E={date:t.date,qty:t.qty,disc:t.discAmt!=null?t.discAmt:(t.disc||0),dcur:t.discCur||"EGP",extra:t.extra||0,pay:t.pay,paid:+(+(t.paid!=null?t.paid:t.collect)).toFixed(2),cust:t.customer||"",note:t.note||""};render();window.scrollTo(0,0)}}
 else if(a==="ret"){if(armed===v){armed="";db.collection("ret").add({tid:v,ts:Date.now(),date:today(),by:me.id}).then(()=>toast("Returned ✓")).catch(er)}else{armed=v;render()}}
 else if(a==="ccsave")ccsave();
 else if(a==="xsave")xsave();
 else if(a==="fxsave")fxsave();
 else if(a==="fxdel"){if(armed===v){armed="";db.doc("fx/"+v).delete().catch(er)}else{armed=v;render()}}
 else if(a==="cr"){const d=new Date(),m=String(d.getMonth()+1).padStart(2,"0");if(v==="today"){cr.from=cr.to=today()}else if(v==="month"){cr.from=d.getFullYear()+"-"+m+"-01";cr.to=today()}else{cr.from="2000-01-01";cr.to=today()}render()}
 else if(a==="xexp")xexp();
 else if(a==="xdel"){if(armed===v){armed="";db.doc("exp/"+v).delete().catch(er)}else{armed=v;render()}}
 else if(a==="ecancel"){ed=null;render()}
 else if(a==="esave")eSave();
 else if(a==="rexp"){const keep=Object.assign({},flt);Object.assign(flt,{from:rm+"-01",to:rm+"-31",type:"",by:""});exp().finally(()=>Object.assign(flt,keep))}
 else if(a==="del"){if(armed===v){armed="";db.doc("tx/"+v).delete().catch(er)}else{armed=v;render()}}
});
document.addEventListener("input",e=>{const t=e.target,f=t.dataset.f;if(t.dataset.x!==undefined){X[t.dataset.x]=t.value;return}if(t.dataset.fx!==undefined){FX[t.dataset.fx]=t.value;return}if(t.dataset.cc!==undefined){const k=t.dataset.cc.split("|");if(k[0]==="o")CC.open[k[1]]=t.value;else if(k[0]==="n")CC.cnt[k[1]]=t.value;else CC.note=t.value;updCC();return}if(t.dataset.e){E[t.dataset.e]=t.value;if(t.dataset.e==="pay"){E.paid="";render()}return}if(!f)return;
 F[f]=(f==="disc"||f==="extra")?(+t.value||0):t.value;if(f==="paid")F.paidT=t.value!=="";
 if(f==="veh")$("#dur").innerHTML=durOpts();
 if(f==="veh")F.dur=$("#dur").value;
 upd();
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.l){flt[t.dataset.l]=t.value;render()}
 else if(t.dataset.r){if(t.dataset.r==="c")rc=t.value;else rm=t.value||rm;render()}
 else if(t.dataset.c2){cr[t.dataset.c2]=t.value;render()}
 else if(t.dataset.c)setCfg(t.dataset.c,t.value);
 else if(t.dataset.p)editProd(t);
});
</script></body></html>
